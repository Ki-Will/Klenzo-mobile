publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  go_router: ^13.0.1
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  connectivity_plus: ^5.0.2
  uuid: ^4.3.3
  intl: ^0.19.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
